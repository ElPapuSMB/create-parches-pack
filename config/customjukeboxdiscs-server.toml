[library]
	#Show players their own uploads and explicitly shared tracks.
	personalLibrary = false

[audio]
	#Normal jukebox range in blocks when redstone power is zero.
	# Default: 64
	# Range: 1 ~ 1024
	jukeboxDefaultRange = 64
	#Normal jukebox range per redstone strength (1-15).
	# Default: 3
	# Range: 1 ~ 64
	jukeboxRedstoneRangeMultiplier = 3

[limits]
	# Default: 26214400
	# Range: 1 ~ 2147483647
	maxSourceBytes = 26214400
	# Default: 600000
	# Range: 1 ~ 600000
	maxDurationMillis = 600000
	# Default: 20
	# Range: 1 ~ 10000
	maxTracksPerPlayer = 20
	# Default: 104857600
	# Range: 1 ~ 9223372036854775807
	maxBytesPerPlayer = 104857600
	# Default: 2147483648
	# Range: 1 ~ 9223372036854775807
	maxServerBytes = 2147483648
	# Default: 1
	# Range: 1 ~ 16
	maxSessionsPerPlayer = 1
	# Default: 32768
	# Range: 1 ~ 1048576
	chunkBytes = 32768
	# Default: 524288
	# Range: > 1
	uploadBytesPerSecond = 524288
	# Default: 120000
	# Range: 1 ~ 3600000
	uploadTimeoutMillis = 120000

[formats]
	mp3Enabled = true
	oggEnabled = true

[urlUploads]
	#Allow writing a disc from a direct https link to an .mp3 or .ogg file.
	enabled = false
	#Hosts the server may download from. Subdomains of a listed host are allowed.
	allowedHosts = ["archive.org", "ia800000.us.archive.org", "files.catbox.moe", "freemusicarchive.org", "cdn.discordapp.com", "media.discordapp.net", "github.io", "githubusercontent.com"]
	#Allow downloading from the server's own network. Only enable this when the
	#audio source runs on a machine you control; it removes a safeguard that stops
	#a link from reaching services that are not meant to be reachable from outside.
	allowPrivateAddresses = false
